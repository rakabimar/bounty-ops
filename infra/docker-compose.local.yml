services:
  postgres:
    image: postgres:16
    container_name: bountyops-postgres
    environment:
      POSTGRES_DB: bountyops
      POSTGRES_USER: bountyops
      POSTGRES_PASSWORD: bountyops
    ports:
      - "5432:5432"
    volumes:
      - ../data/postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: bountyops-redis
    ports:
      - "6379:6379"
    volumes:
      - ../data/redis:/data
