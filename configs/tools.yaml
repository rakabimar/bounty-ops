tools:
  - name: subfinder
    binary: subfinder
    enabled: true
    stage: passive
    defaultArgs: ["-all", "-recursive", "-silent", "-json"]
    outputFormat: jsonl
    supportsJson: true
    supportsStdin: false
    notes: Passive subdomain enumeration for the Phase 6 MVP.
  - name: dnsx
    binary: dnsx
    enabled: true
    stage: active_light
    defaultArgs: ["-silent", "-json", "-a", "-aaaa", "-cname", "-resp"]
    outputFormat: jsonl
    supportsJson: true
    supportsStdin: true
    notes: DNS validation and record enrichment for in-scope hosts only.
  - name: httpx
    binary: httpx
    enabled: true
    stage: active_light
    defaultArgs: ["-silent", "-json", "-title", "-tech-detect", "-status-code", "-content-length", "-response-time", "-follow-redirects"]
    outputFormat: jsonl
    supportsJson: true
    supportsStdin: true
    notes: HTTP probing for Scope Guard-approved targets; required headers are injected.
  - name: naabu
    binary: naabu
    enabled: false
    stage: active_medium
    defaultArgs: []
    outputFormat: jsonl
    supportsJson: true
    supportsStdin: true
    notes: Deferred beyond Phase 6.
  - name: gau
    binary: gau
    enabled: true
    stage: passive
    defaultArgs: ["--subs"]
    outputFormat: plain
    supportsJson: false
    supportsStdin: false
    notes: Historical URL collection.
  - name: waybackurls
    binary: waybackurls
    enabled: true
    stage: passive
    defaultArgs: []
    outputFormat: plain
    supportsJson: false
    supportsStdin: true
    notes: Wayback historical URL collection.
  - name: katana
    binary: katana
    enabled: true
    stage: active_medium
    defaultArgs: ["-silent", "-jsonl", "-d", "2"]
    outputFormat: jsonl
    supportsJson: true
    supportsStdin: true
    notes: Standard crawler only; no headless mode in Phase 10.
  - name: nuclei
    binary: nuclei
    enabled: true
    stage: active_medium
    defaultArgs: ["-silent", "-jsonl", "-ni", "-duc"]
    outputFormat: jsonl
    supportsJson: true
    supportsStdin: true
    notes: Safe template tags only in Phase 10.

nucleiSafeProfile:
  allowedTags: [exposure, misconfig, takeover, tech, panel]
  blockedTags: [dos, bruteforce, intrusive, fuzz, destructive, rce, cve, oob]
  allowedSeverities: [info, low, medium, high, critical]
